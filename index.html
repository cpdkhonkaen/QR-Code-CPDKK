<script>
// ==========================================================================
// 🛠️ ระบบเชื่อมต่อและแก้ไขปัญหาสำหรับ GitHub Pages (Compatibility Bridge)
// ==========================================================================
var SCRIPT_URL = '<?= scriptUrl ?>';
if (SCRIPT_URL.startsWith('<?') || SCRIPT_URL === '') {
    /**
     * ⚠️ ขั้นตอนสำคัญสำหรับคุณ: 
     * ให้นำ URL ที่ได้จากการ Deploy ของ Google Apps Script มาวางแทนที่ URL ตัวอย่างด้านล่างนี้
     */
    SCRIPT_URL = "https://script.google.com/macros/s/AKfycbze-UU7t2eAC0bLhX1wWNuV3UAw8kJ1kRqyUUYZTIt6ijcPGsTxd9IdTFQswaGG9PvU5A/exec"; 
}
window.GAS_WEB_APP_URL = SCRIPT_URL;

// ระบบจำลอง google.script.run อัจฉริยะเพื่อให้รันโค้ดบันทึกข้อมูลเดิมได้บน GitHub Pages
if (typeof google === 'undefined' || !google.script) {
    window.google = {
        script: {
            run: {
                _successHandler: null,
                _failureHandler: null,
                withSuccessHandler: function(callback) {
                    this._successHandler = callback;
                    return this;
                },
                withFailureHandler: function(callback) {
                    this._failureHandler = callback;
                    return this;
                }
            }
        }
    };

    // ใช้ JavaScript Proxy ดักจับทุกฟังก์ชันเดิม เช่น testConnection และเซฟค่าลง Drive โดยอัตโนมัติ
    window.google.script.run = new Proxy(window.google.script.run, {
        get: function(target, prop) {
            if (prop === 'withSuccessHandler' || prop === 'withFailureHandler') {
                return target[prop].bind(target);
            }
            return function(...args) {
                const successCallback = target._successHandler;
                const failureCallback = target._failureHandler;
                target._successHandler = null;
                target._failureHandler = null;

                // ยิงข้อมูลกลับไปยัง Google Apps Script ( bypass ปัญหา CORS preflight )
                fetch(window.GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        functionName: prop,
                        arguments: args
                    })
                })
                .then(response => response.json())
                .then(res => {
                    if (res.status === 'success') {
                        if (successCallback) successCallback(res.result);
                    } else {
                        if (failureCallback) failureCallback(new Error(res.message));
                    }
                })
                .catch(err => {
                    console.error("GAS Bridge Error:", err);
                    if (failureCallback) failureCallback(err);
                });
            };
        }
    });
}
